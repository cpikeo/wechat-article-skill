name: ci
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 回归（合成语料 · 人格 · 护栏 · 渲染断言 · payload · 素材 · 配置优先级）
        run: |
          python3 scripts/selftest.py
      - name: 中文字体（禁止缺字截图）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig
      - name: Gate 3 六人格与四宽度截图证据
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium --only-shell
          python3 scripts/selftest.py --shots --shoot examples/draft-handoff.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate3-shots
          path: assets/shots/*.png
