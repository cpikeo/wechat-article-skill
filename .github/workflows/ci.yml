name: ci
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate 1/2、主题一致性、真实来源编辑评估与发布保护
        run: python3 tests/run.py
      - name: 中文字体（禁止缺字截图）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig
      - name: Gate 3 四宽度与同稿六人格截图证据
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium --only-shell
          python3 tests/run.py --shots --shoot examples/draft-handoff.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate3-shots
          path: |
            assets/shots/*.png
            assets/shots/REVIEW.md
