name: ci
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 回归（用例 · 人格 · 护栏 · 渲染断言 · payload · 素材 · 配置优先级）
        run: python3 scripts/selftest.py
      - name: Gate 3 截图证据（390px · 2x）
        run: |
          pip install playwright
          python3 -m playwright install chromium --only-shell
          python3 scripts/selftest.py --shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate3-shots
          path: assets/shots/*.png
