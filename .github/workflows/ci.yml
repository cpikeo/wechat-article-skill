name: ci
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate 1/2、编辑智能、主题配置、交付与发布保护（含 V7 回归）
        run: python3 tests/run.py
      - name: 交付包与事实单元比对冒烟
        run: |
          cp examples/draft-handoff.md /tmp/original.md
          python3 scripts/render.py examples/draft-handoff.md \
            --against /tmp/original.md --deliver /tmp/deliver
      - name: 六类真实来源样稿的确定性回归
        run: python3 tests/editorial_eval.py --check-report
      - name: 中文字体（禁止缺字截图）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig
      - name: 四宽度合成回归截图与复制边界
        run: |
          pip install playwright pillow
          python3 -m playwright install --with-deps chromium --only-shell
          python3 tests/run.py --shots --shoot examples/draft-handoff.md
      - name: 六主题真实样稿、320/360/390/430px 与去色同稿比较
        run: python3 tests/visuals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate3-visual-review
          path: |
            evaluation/visual-review/**/*.png
            evaluation/visual-review/**/*.jpg
            evaluation/visual-review/**/REVIEW.md
            evaluation/visual-review/REPORT.md
